<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="dishGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Outer glowing ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#goldGrad)" stroke-width="8" opacity="0.4"/>

  <!-- Dish / Plate Base -->
  <circle cx="256" cy="256" r="160" fill="#092f24" stroke="url(#goldGrad)" stroke-width="12"/>
  <circle cx="256" cy="256" r="120" fill="none" stroke="#34d399" stroke-width="4" stroke-dasharray="12 8" opacity="0.6"/>

  <!-- Cloche / Dining Cover or Utensils in Center -->
  <!-- Cloche Handle -->
  <circle cx="256" cy="180" r="16" fill="#fbbf24"/>
  <!-- Cloche Dome -->
  <path d="M 160 270 A 96 96 0 0 1 352 270 Z" fill="url(#dishGrad)"/>
  <!-- Platter rim -->
  <rect x="140" y="270" width="232" height="16" rx="8" fill="#fbbf24"/>
  
  <!-- Steam Curves -->
  <path d="M 230 155 Q 220 135 230 115" fill="none" stroke="#34d399" stroke-width="6" stroke-linecap="round"/>
  <path d="M 256 150 Q 266 130 256 110" fill="none" stroke="#fbbf24" stroke-width="6" stroke-linecap="round"/>
  <path d="M 282 155 Q 292 135 282 115" fill="none" stroke="#34d399" stroke-width="6" stroke-linecap="round"/>

  <!-- Text MealMaster in curved bottom or pill -->
  <g transform="translate(256, 335)">
    <rect x="-90" y="0" width="180" height="36" rx="18" fill="#059669"/>
    <text x="0" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">MEALMASTER</text>
  </g>
</svg>
